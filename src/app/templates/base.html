<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biblioteko</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          crossorigin="anonymous"/>

    <style>
      body { min-height: 100vh; }
      .sidebar { min-height: 100vh; border-right: 1px solid #e5e7eb; }
      .sidebar .nav-link.active { background-color: rgba(13, 110, 253, 0.1); font-weight: 600; }
      pre.preview { max-height: 10rem; overflow: auto; background:#f8f9fa; padding:8px; white-space: pre-wrap; }
      .card-compact { padding: .75rem; }
      .stat-num { font-size: 1.5rem; font-weight:700; }
      .container-main { padding-top: 1rem; }
    </style>
  </head>

  <body>
    <div class="container-fluid">
      <div class="row g-0">
        <!-- SIDEBAR -->
        <nav class="col-md-2 d-none d-md-block sidebar bg-light p-3">
          <div class="d-flex align-items-center mb-3">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' fill='none' stroke='%23007bff' stroke-width='2' viewBox='0 0 24 24'><rect x='3' y='4' width='18' height='16' rx='2' fill='%23e3f2fd'/><path d='M7 4v16M17 4v16' stroke='%23007bff'/></svg>"
                 alt="book logo" width="32" height="32" class="me-2"/>
            <strong>Files Management Portal</strong>
          </div>

          <ul class="nav nav-pills flex-column">
            <li class="nav-item"><a class="nav-link" href="/books">📚 Books</a></li>
            <li class="nav-item"><a class="nav-link" href="#permanent">✅ Permanent Scans</a></li>
            <li class="nav-item"><a class="nav-link" href="#temp">⏳ Temporary Scans</a></li>
          </ul>

          <hr/>
          <div>
            <small class="text-muted">Role: <strong>Admin</strong></small>
          </div>
        </nav>

        <!-- MAIN -->
        <main class="col-md-10 col-12 p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h1><a href="/" style="text-decoration:none; color:inherit;">Biblioteko</a></h1>
              <small class="text-muted">Manage scanned files & read books</small>
            </div>

            <div>
              <a href="/home/logout" class="btn btn-sm btn-warning" type="submit">Déconnexion</a>
            </div>

            <div class="d-flex align-items-center">
              <form class="d-flex p-0 m-0" role="search" action="/books" method="get">
                <input name="q" class="form-control form-control-sm" type="search" placeholder="Search files or users" aria-label="Search"/>
                <button class="btn btn-sm btn-outline-primary" type="submit">Search</button>
              </form>
              <div class="ms-3">
                <a class="btn btn-sm btn-warning" href="/dashboard">Admin Dashboard</a>
              </div>
            </div>
          </div>

          <!-- PAGE CONTENT -->
          {% block content %}
          <p class="text-muted">No content supplied yet.</p>
          {% endblock %}

        </main>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
