{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <div class="row mb-4 text-center">
    <div class="col">
      <h1>Welcome to Biblioteko</h1>
      <p class="lead">Your personal library and document management system.</p>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-12">
      <h4>Quick Links</h4>
      <div class="d-flex justify-content-between">
        <a href="{{ url_for('views.books_view') }}" class="btn btn-primary flex-fill mx-2">Browse Books</a>
        <a href="/home/upload" class="btn btn-success flex-fill mx-2">Upload a Book?</a>
        <a href="{{ url_for('views.dashboard_view') }}" class="btn btn-secondary flex-fill mx-2">Admin Dashboard</a>
      </div>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Library Stats</h5>
          <p class="card-text">
            <strong>Total Books:</strong> {{ books_list|length }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
